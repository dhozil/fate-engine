<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="55%" stop-color="#17102e"/>
      <stop offset="100%" stop-color="#0a0717"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8c8ff"/>
      <stop offset="70%" stop-color="#b08cff"/>
      <stop offset="100%" stop-color="#7a4dff"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
  </defs>

  <!-- dark cosmic background -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffd76a" stroke-opacity="0.25" stroke-width="1"/>

  <!-- constellation dots -->
  <circle cx="12" cy="15" r="1.1" fill="#ffd76a" fill-opacity="0.9"/>
  <circle cx="20" cy="11" r="0.8" fill="#ffd76a" fill-opacity="0.6"/>
  <circle cx="48" cy="14" r="1" fill="#ffd76a" fill-opacity="0.8"/>
  <circle cx="54" cy="22" r="0.8" fill="#ffd76a" fill-opacity="0.6"/>
  <circle cx="10" cy="48" r="0.9" fill="#ffd76a" fill-opacity="0.7"/>
  <circle cx="52" cy="50" r="0.9" fill="#ffd76a" fill-opacity="0.7"/>

  <!-- constellation lines -->
  <g stroke="#ffd76a" stroke-opacity="0.35" stroke-width="0.7" fill="none">
    <path d="M12 15 L20 11 M20 11 L48 14 M48 14 L54 22 M10 48 L52 50"/>
    <path d="M20 11 L28 16 M28 16 L48 14"/>
  </g>

  <!-- tilted orbital rings -->
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="1.2" transform="rotate(-18 32 32)"/>
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#ring)" stroke-opacity="0.3" stroke-width="0.8" transform="rotate(24 32 32)"/>

  <!-- glowing orb / crystal ball -->
  <circle cx="32" cy="32" r="12" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#ffd76a" stroke-opacity="0.35" stroke-width="1"/>
  <ellipse cx="28.5" cy="27.5" rx="4.5" ry="3" fill="#ffffff" fill-opacity="0.55" transform="rotate(-20 28.5 27.5)"/>

  <!-- fate star ✦ -->
  <path d="M32 23.5 L34 30 L40.5 32 L34 34 L32 40.5 L30 34 L23.5 32 L30 30 Z"
        fill="url(#glow)" stroke="url(#ring)" stroke-width="1"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffd76a"/>

  <!-- sparkle accent -->
  <path d="M45 34 L45.8 36.2 L48 37 L45.8 37.8 L45 40 L44.2 37.8 L42 37 L44.2 36.2 Z" fill="#ffd76a" fill-opacity="0.85"/>
  <path d="M19 40 L19.6 41.6 L21.2 42.2 L19.6 42.8 L19 44.4 L18.4 42.8 L16.8 42.2 L18.4 41.6 Z" fill="#ffd76a" fill-opacity="0.6"/>
</svg>
